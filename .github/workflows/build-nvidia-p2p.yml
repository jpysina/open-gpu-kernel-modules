name: Build NVIDIA P2P Kernel Modules

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      nvidia_version:
        description: 'NVIDIA driver version. Leave empty for latest.'
        required: false
        default: ''
      kernel_version:
        description: 'Kernel version. Leave empty for latest.'
        required: false
        default: ''
      ubuntu_version:
        description: 'Ubuntu version. Leave empty for latest.'
        required: false
        default: ''
      build_all_kernels:
        description: 'Build for multiple kernel versions (comma-separated). Leave empty for latest only.'
        required: false
        default: ''
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-nvidia-p2p.yml'
      - 'p2p.patch'

jobs:
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      nvidia_version: ${{ steps.detect.outputs.nvidia_version }}
      kernel_versions: ${{ steps.detect.outputs.kernel_versions }}
      ubuntu_version: ${{ steps.detect.outputs.ubuntu_version }}
    steps:
      - name: Detect latest versions
        id: detect
        run: |
          NVIDIA_VER="${{ inputs.nvidia_version }}"
          KERNEL_VER="${{ inputs.kernel_version }}"
          UBUNTU_VER="${{ inputs.ubuntu_version }}"
          
          # Auto-detect latest NVIDIA version
          if [ -z "$NVIDIA_VER" ]; then
            echo "Detecting latest NVIDIA version..."
            NVIDIA_VER=$(curl -sL "https://download.nvidia.com/XFree86/Linux-x86_64/" 2>/dev/null | \
              grep -oP 'href="[0-9]+\.[0-9]+(\.[0-9]+)?/"' | \
              grep -oP '[0-9]+\.[0-9]+(\.[0-9]+)?' | \
              sort -V | \
              tail -1)
            
            if [ -z "$NVIDIA_VER" ]; then
              echo "Trying NVIDIA download page..."
              NVIDIA_VER=$(curl -sL "https://www.nvidia.com/Download/processFind.aspx?psid=95&pfid=811&osid=57&lid=1" 2>/dev/null | \
                grep -oP '[0-9]{3}\.[0-9]{2}(\.[0-9]{2})?' | \
                head -1)
            fi
            
            if [ -z "$NVIDIA_VER" ]; then
              NVIDIA_VER="590.57"
            fi
          fi
          echo "NVIDIA version: ${NVIDIA_VER}"
          
          # Auto-detect latest Ubuntu LTS version
          if [ -z "$UBUNTU_VER" ]; then
            echo "Detecting latest Ubuntu LTS version..."
            UBUNTU_VER=$(curl -sL "https://api.github.com/repos/canonical/ubuntu-cloud-image/releases/latest" 2>/dev/null | \
              grep -oP '"tag_name":\s*"v?\K[0-9]+\.[0-9]+' | \
              head -1)
            
            if [ -z "$UBUNTU_VER" ]; then
              UBUNTU_VER=$(curl -sL "https://cloud-images.ubuntu.com/releases/" 2>/dev/null | \
                grep -oP 'href="[0-9]+\.[0-9]+/"' | \
                grep -oP '[0-9]+\.[0-9]+' | \
                sort -V | \
                tail -1)
            fi
            
            if [ -z "$UBUNTU_VER" ]; then
              UBUNTU_VER="24.04"
            fi
          fi
          echo "Ubuntu version: ${UBUNTU_VER}"
          
          # Auto-detect latest kernel
          if [ -n "${{ inputs.build_all_kernels }}" ]; then
            KERNELS="${{ inputs.build_all_kernels }}"
            KERNELS=$(echo "$KERNELS" | tr ',' '\n' | jq -R . | jq -s .)
          elif [ -n "$KERNEL_VER" ]; then
            KERNELS="[\"${KERNEL_VER}\"]"
          else
            echo "Detecting latest kernel for Ubuntu ${UBUNTU_VER}..."
            DIST_CODENAME=$(curl -sL "http://archive.ubuntu.com/ubuntu/dists/" 2>/dev/null | \
              grep -oP 'href="\K[a-z]+(?=-updates)' | \
              sort -u | \
              tail -1)
            
            if [ -n "$DIST_CODENAME" ]; then
              LATEST_KERNEL=$(curl -s "http://archive.ubuntu.com/ubuntu/dists/${DIST_CODENAME}-updates/main/binary-amd64/Packages.gz" 2>/dev/null | \
                zcat 2>/dev/null | \
                grep -A2 "^Package: linux-image-" | \
                grep -oP 'linux-image-\K[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-generic' | \
                sort -V -u | \
                tail -1)
            fi
            
            if [ -z "$LATEST_KERNEL" ]; then
              LATEST_KERNEL="6.17.0-19-generic"
            fi
            
            KERNELS="[\"${LATEST_KERNEL}\"]"
          fi
          echo "Kernel versions: ${KERNELS}"
          
          # Output results
          echo "nvidia_version=${NVIDIA_VER}" >> $GITHUB_OUTPUT
          echo "ubuntu_version=${UBUNTU_VER}" >> $GITHUB_OUTPUT
          echo "kernel_versions=${KERNELS}" >> $GITHUB_OUTPUT

  build:
    needs: detect-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel_version: ${{ fromJSON(needs.detect-versions.outputs.kernel_versions) }}
    container:
      image: ubuntu:${{ needs.detect-versions.outputs.ubuntu_version }}
    env:
      NVIDIA_VERSION: ${{ needs.detect-versions.outputs.nvidia_version }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            kmod \
            libelf-dev \
            cpio \
            file \
            ca-certificates \
            patch \
            jq

      - name: Install kernel headers
        run: |
          KERNEL_VER="${{ matrix.kernel_version }}"
          echo "Installing kernel headers for ${KERNEL_VER}..."
          
          apt-get install -y linux-headers-${KERNEL_VER} || \
          apt-get install -y linux-headers-generic || \
          echo "Headers may need manual installation"
          
          ls -la /usr/src/ | grep linux-headers

      - name: Checkout repository for P2P patch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download NVIDIA driver
        run: |
          VERSION="${{ env.NVIDIA_VERSION }}"
          echo "Downloading NVIDIA driver version ${VERSION}"
          
          URLS=(
            "https://download.nvidia.com/XFree86/Linux-x86_64/${VERSION}/NVIDIA-Linux-x86_64-${VERSION}.run"
            "https://us.download.nvidia.com/XFree86/Linux-x86_64/${VERSION}/NVIDIA-Linux-x86_64-${VERSION}.run"
            "https://international.download.nvidia.com/XFree86/Linux-x86_64/${VERSION}/NVIDIA-Linux-x86_64-${VERSION}.run"
          )
          
          for url in "${URLS[@]}"; do
            echo "Trying: ${url}"
            if wget -q --show-progress "${url}" -O NVIDIA-Linux-x86_64-${VERSION}.run; then
              echo "Download successful"
              break
            fi
          done
          
          chmod +x NVIDIA-Linux-x86_64-${VERSION}.run
          ls -la NVIDIA-Linux-x86_64-${VERSION}.run

      - name: Extract driver and kernel sources
        run: |
          VERSION="${{ env.NVIDIA_VERSION }}"
          
          echo "Extracting driver..."
          ./NVIDIA-Linux-x86_64-${VERSION}.run --extract-only --target nvidia-extracted
          
          echo "Extracted contents:"
          ls -la nvidia-extracted/
          ls -la nvidia-extracted/kernel-open/

      - name: Apply P2P patch
        run: |
          VERSION="${{ env.NVIDIA_VERSION }}"
          cd nvidia-extracted/kernel-open
          
          if [ -f "${GITHUB_WORKSPACE}/p2p.patch" ]; then
            echo "Applying P2P patch from repository..."
            patch -p1 < "${GITHUB_WORKSPACE}/p2p.patch" || echo "Patch may have partial failures, continuing..."
          else
            echo "Creating P2P patch inline..."
            
            sed -i 's/if (NVreg_EnableResizableBar == 0)/\/\*if (NVreg_EnableResizableBar == 0)\//' nvidia/nv-pci.c
            sed -i 's/nv_printf(NV_DBG_INFO, "NVRM: resizable BAR disabled by regkey, skipping\\n");/\/\*nv_printf(NV_DBG_INFO, "NVRM: resizable BAR disabled by regkey, skipping\\n");/' nvidia/nv-pci.c
            sed -i 's/return 0;$/\/\*return 0;*\//' nvidia/nv-pci.c
            sed -i 's/}$/\}\*\//' nvidia/nv-pci.c
            
            sed -i 's/pKernelBif->p2pOverride = BIF_P2P_NOT_OVERRIDEN;/pKernelBif->p2pOverride = 0x11;/' ../src/nvidia/src/kernel/gpu/bif/kernel_bif.c
            sed -i 's/pKernelBif->forceP2PType = NV_REG_STR_RM_FORCE_P2P_TYPE_DEFAULT;/pKernelBif->forceP2PType = NV_REG_STR_RM_FORCE_P2P_TYPE_BAR1P2P;/' ../src/nvidia/src/kernel/gpu/bif/kernel_bif.c
            
            echo "Inline patches applied"
          fi
          
          echo '#define NV_COMPILER "GCC " __VERSION__' > nv_compiler.h

      - name: Prepare binary files
        run: |
          VERSION="${{ env.NVIDIA_VERSION }}"
          cd nvidia-extracted
          
          mkdir -p src/nvidia/_out/Linux_x86_64
          mkdir -p src/nvidia-modeset/_out/Linux_x86_64
          
          cp kernel-open/nvidia/nv-kernel.o_binary src/nvidia/_out/Linux_x86_64/nv-kernel.o
          cp kernel-open/nvidia-modeset/nv-modeset-kernel.o_binary src/nvidia-modeset/_out/Linux_x86_64/nv-modeset-kernel.o
          
          ls -la src/nvidia/_out/Linux_x86_64/
          ls -la src/nvidia-modeset/_out/Linux_x86_64/

      - name: Build kernel modules
        run: |
          KERNEL_VER="${{ matrix.kernel_version }}"
          VERSION="${{ env.NVIDIA_VERSION }}"
          cd nvidia-extracted
          
          echo "Building for kernel: ${KERNEL_VER}"
          
          make modules -j$(nproc) 2>&1 | tee build.log
          
          echo "Build artifacts:"
          find kernel-open -name "*.ko" -exec ls -la {} \;
          
          for ko in kernel-open/*.ko; do
            echo "Module info for ${ko}:"
            modinfo "${ko}" | grep -E "vermagic|version"
          done

      - name: Package kernel modules
        run: |
          VERSION="${{ env.NVIDIA_VERSION }}"
          KERNEL_VER="${{ matrix.kernel_version }}"
          cd nvidia-extracted
          
          PACKAGE_DIR="nvidia-p2p-modules-${VERSION}-kernel-${KERNEL_VER}"
          mkdir -p ${PACKAGE_DIR}
          
          cp kernel-open/*.ko ${PACKAGE_DIR}/
          cp NVIDIA-Linux-x86_64-${VERSION}.run ${PACKAGE_DIR}/ || true
          
          cat > ${PACKAGE_DIR}/install.sh << 'INSTALL_EOF'
          #!/bin/bash
          set -e

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          DRIVER_FILE=$(ls "${SCRIPT_DIR}"/NVIDIA-Linux-x86_64-*.run 2>/dev/null | head -1)
          MODULES_DIR="${SCRIPT_DIR}"

          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          NC='\033[0m'

          log_info() { echo -e "${GREEN}[INFO]${NC} $1"; }
          log_warn() { echo -e "${YELLOW}[WARN]${NC} $1"; }
          log_error() { echo -e "${RED}[ERROR]${NC} $1"; }

          check_root() {
              if [ "$EUID" -ne 0 ]; then
                  log_error "Please run as root"
                  exit 1
              fi
          }

          detect_distro() {
              if [ -f /etc/os-release ]; then
                  . /etc/os-release
                  echo "$ID"
              else
                  log_error "Cannot detect distribution"
                  exit 1
              fi
          }

          install_dependencies() {
              local distro=$(detect_distro)
              log_info "Installing dependencies for $distro..."
              case $distro in
                  ubuntu|debian)
                      apt-get update
                      apt-get install -y build-essential linux-headers-$(uname -r) wget
                      ;;
                  fedora|rhel|centos)
                      dnf install -y kernel-devel kernel-headers gcc make wget
                      ;;
                  arch)
                      pacman -Sy --noconfirm linux-headers base-devel wget
                      ;;
              esac
          }

          disable_nouveau() {
              log_info "Disabling nouveau driver..."
              cat > /etc/modprobe.d/blacklist-nouveau.conf << 'EOF'
          blacklist nouveau
          options nouveau modeset=0
          EOF
              command -v update-initramfs &> /dev/null && update-initramfs -u
              command -v dracut &> /dev/null && dracut --force
          }

          install_driver() {
              [ -z "$DRIVER_FILE" ] && { log_error "Driver file not found"; exit 1; }
              log_info "Installing NVIDIA driver..."
              chmod +x "$DRIVER_FILE"
              "$DRIVER_FILE" --no-kernel-modules -a -s --no-x-check -z --skip-module-load
          }

          install_kernel_modules() {
              log_info "Installing P2P kernel modules..."
              local modules=("nvidia.ko" "nvidia-drm.ko" "nvidia-modeset.ko" "nvidia-uvm.ko" "nvidia-peermem.ko")
              local modules_dest="/lib/modules/$(uname -r)/kernel/drivers/video"
              mkdir -p "${modules_dest}"
              for mod in "${modules[@]}"; do
                  [ -f "${MODULES_DIR}/${mod}" ] && cp "${MODULES_DIR}/${mod}" "${modules_dest}/"
              done
              depmod -a
              command -v update-initramfs &> /dev/null && update-initramfs -u
          }

          configure_auto_load() {
              log_info "Configuring auto-load..."
              cat > /etc/modules-load.d/nvidia.conf << 'EOF'
          nvidia
          nvidia-drm
          nvidia-modeset
          nvidia-uvm
          EOF
              cat > /etc/modprobe.d/nvidia.conf << 'EOF'
          options nvidia NVreg_PreserveVideoMemoryAllocations=1
          options nvidia-drm modeset=1
          EOF
          }

          print_summary() {
              echo ""
              echo "========================================"
              echo "  NVIDIA P2P Driver Installation Complete"
              echo "========================================"
              echo "Reboot: sudo reboot"
              echo "Verify: nvidia-smi && nvidia-smi topo -m"
          }

          check_root
          [ "$1" != "--skip-deps" ] && install_dependencies
          [ "$1" != "--skip-nouveau" ] && disable_nouveau
          [ "$1" != "--skip-driver" ] && install_driver
          install_kernel_modules
          configure_auto_load
          print_summary
          INSTALL_EOF
          
          chmod +x ${PACKAGE_DIR}/install.sh
          
          cat > ${PACKAGE_DIR}/README.txt << EOF
          NVIDIA P2P Kernel Modules (Auto-Patched)
          ========================================
          Driver Version: ${VERSION}
          Kernel Version: ${KERNEL_VER}
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          This package was automatically built from NVIDIA official source
          with P2P (Peer-to-Peer) patches applied for consumer GPUs.
          
          Quick Install:
          1. Extract: tar -xzf ${PACKAGE_DIR}.tar.gz
          2. Install: sudo ./install.sh
          3. Reboot: sudo reboot
          
          IMPORTANT: This package is for kernel ${KERNEL_VER}
          Check: uname -r
          EOF
          
          tar -czvf ${PACKAGE_DIR}.tar.gz ${PACKAGE_DIR}
          ls -la ${PACKAGE_DIR}.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-p2p-${{ env.NVIDIA_VERSION }}-kernel-${{ matrix.kernel_version }}
          path: nvidia-extracted/nvidia-p2p-modules-*.tar.gz
          retention-days: 30

  create-release:
    needs: [detect-versions, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.detect-versions.outputs.nvidia_version }}-auto-${{ github.run_number }}
          name: NVIDIA P2P Modules ${{ needs.detect-versions.outputs.nvidia_version }} (Auto-Patched)
          body: |
            NVIDIA P2P Kernel Modules (Auto-Patched from Official Source)
            ============================================================
            
            **Driver Version:** ${{ needs.detect-versions.outputs.nvidia_version }}
            **Build Date:** ${{ github.event.head_commit.timestamp }}
            
            ## Features
            - Automatically patched from NVIDIA official source
            - P2P (Peer-to-Peer) support for consumer GPUs (RTX series)
            - Built for multiple kernel versions
            
            ## Download
            Choose the package matching your kernel version (`uname -r`)
            
            ## Install
            ```bash
            tar -xzf nvidia-p2p-modules-*.tar.gz
            cd nvidia-p2p-modules-*
            sudo ./install.sh
            sudo reboot
            ```
            
            ## Verify
            ```bash
            nvidia-smi
            nvidia-smi topo -m
            ```
          files: artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
