name: Build NVIDIA P2P Kernel Modules

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      nvidia_version:
        description: 'NVIDIA driver version (e.g., 595.45.04). Leave empty for latest from NVIDIA/open-gpu-kernel-modules.'
        required: false
        default: ''
      kernel_version:
        description: 'Kernel version (e.g., 6.17.0-19-generic). Leave empty for latest.'
        required: false
        default: ''
      ubuntu_version:
        description: 'Ubuntu version. Leave empty for latest (e.g., 25.10). Use "lts" for latest LTS (e.g., 24.04).'
        required: false
        default: ''
      use_lts:
        description: 'Use LTS Ubuntu version (alternative to ubuntu_version input)'
        type: boolean
        required: false
        default: false
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-nvidia-p2p.yml'
      - 'p2p.patch'

jobs:
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      nvidia_version: ${{ steps.detect.outputs.nvidia_version }}
      kernel_versions: ${{ steps.detect.outputs.kernel_versions }}
      ubuntu_version: ${{ steps.detect.outputs.ubuntu_version }}
      auto_detected: ${{ steps.detect.outputs.auto_detected }}
    steps:
      - name: Detect latest versions
        id: detect
        shell: bash
        run: |
          NVIDIA_VER="${{ inputs.nvidia_version }}"
          KERNEL_VER="${{ inputs.kernel_version }}"
          UBUNTU_VER="${{ inputs.ubuntu_version }}"
          USE_LTS="${{ inputs.use_lts }}"
          AUTO_DETECTED="false"
          
          if [ -z "$NVIDIA_VER" ]; then
            AUTO_DETECTED="true"
            echo "Detecting latest NVIDIA version from NVIDIA/open-gpu-kernel-modules..."
            
            NVIDIA_VER=$(curl -sL --connect-timeout 10 \
              "https://api.github.com/repos/NVIDIA/open-gpu-kernel-modules/tags?per_page=10" 2>/dev/null | \
              jq -r '.[].name' 2>/dev/null | \
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | \
              head -1)
            
            if [ -z "$NVIDIA_VER" ] || [ "$NVIDIA_VER" = "null" ]; then
              echo "GitHub API failed, trying fallback..."
              NVIDIA_VER=$(curl -sL --connect-timeout 10 \
                "https://api.github.com/repos/NVIDIA/open-gpu-kernel-modules/releases/latest" 2>/dev/null | \
                jq -r '.tag_name' 2>/dev/null)
            fi
            
            if [ -z "$NVIDIA_VER" ] || [ "$NVIDIA_VER" = "null" ]; then
              echo "All detection failed, using fallback version"
              NVIDIA_VER="595.45.04"
            fi
            
            echo "Detected NVIDIA version: ${NVIDIA_VER}"
          fi
          
          if [ -z "$UBUNTU_VER" ]; then
            if [ "$USE_LTS" = "true" ]; then
              UBUNTU_VER="lts"
            else
              AUTO_DETECTED="true"
              echo "Detecting latest stable Ubuntu version..."
              
              UBUNTU_VER=$(curl -sL --connect-timeout 10 \
                "https://cloud-images.ubuntu.com/releases/" 2>/dev/null | \
                grep -oP 'href="[0-9]+\.[0-9]+/"' | \
                grep -oP '[0-9]+\.[0-9]+' | \
                sort -V | \
                tail -1)
              
              if [ -z "$UBUNTU_VER" ]; then
                UBUNTU_VER="24.10"
              fi
              
              echo "Detected Ubuntu version: ${UBUNTU_VER}"
            fi
          fi
          
          if [ "$UBUNTU_VER" = "lts" ] || [ "$UBUNTU_VER" = "LTS" ] || [ "$USE_LTS" = "true" ]; then
            AUTO_DETECTED="true"
            echo "Detecting latest Ubuntu LTS version..."
            
            UBUNTU_VER=$(curl -sL --connect-timeout 10 \
              "https://cloud-images.ubuntu.com/releases/" 2>/dev/null | \
              grep -oP 'href="[0-9]+\.[0-9]+/"' | \
              grep -oP '[0-9]+\.[0-9]+' | \
              sort -V | \
              tail -5 | \
              head -1)
            
            if [ -z "$UBUNTU_VER" ]; then
              UBUNTU_VER="24.04"
            fi
            
            echo "Detected Ubuntu LTS version: ${UBUNTU_VER}"
          fi
          
          if [ -n "$KERNEL_VER" ]; then
            KERNELS="[\"${KERNEL_VER}\"]"
          else
            AUTO_DETECTED="true"
            echo "Detecting latest kernel version for Ubuntu ${UBUNTU_VER}..."
            
            UBUNTU_CODENAME=""
            case "${UBUNTU_VER}" in
              "25.10") UBUNTU_CODENAME="questing" ;;
              "25.04") UBUNTU_CODENAME="plucky" ;;
              "24.10") UBUNTU_CODENAME="oracular" ;;
              "24.04") UBUNTU_CODENAME="noble" ;;
              "22.04") UBUNTU_CODENAME="jammy" ;;
              *)
                UBUNTU_CODENAME=$(curl -sL "https://api.github.com/repos/diddledani/one-script-wsl2-systemd/contents/ubuntu-code-names.json" 2>/dev/null | \
                  jq -r '.content' 2>/dev/null | base64 -d 2>/dev/null | \
                  jq -r ".\"${UBUNTU_VER}\"" 2>/dev/null)
                ;;
            esac
            
            if [ -n "$UBUNTU_CODENAME" ]; then
              echo "Ubuntu codename: ${UBUNTU_CODENAME}"
              
              LATEST_KERNEL=$(curl -s --connect-timeout 15 \
                "http://archive.ubuntu.com/ubuntu/dists/${UBUNTU_CODENAME}-updates/main/binary-amd64/Packages.gz" 2>/dev/null | \
                zcat 2>/dev/null | \
                grep -E "^Package: linux-image-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-generic$" | \
                awk '{print $2}' | \
                sed 's/linux-image-//' | \
                sort -V | \
                tail -1)
              
              if [ -z "$LATEST_KERNEL" ]; then
                LATEST_KERNEL=$(curl -s --connect-timeout 15 \
                  "http://archive.ubuntu.com/ubuntu/dists/${UBUNTU_CODENAME}/main/binary-amd64/Packages.gz" 2>/dev/null | \
                  zcat 2>/dev/null | \
                  grep -E "^Package: linux-image-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-generic$" | \
                  awk '{print $2}' | \
                  sed 's/linux-image-//' | \
                  sort -V | \
                  tail -1)
              fi
            fi
            
            if [ -z "$LATEST_KERNEL" ]; then
              echo "Kernel detection failed, using fallback..."
              case "${UBUNTU_VER}" in
                "25.10") LATEST_KERNEL="6.17.0-19-generic" ;;
                "25.04") LATEST_KERNEL="6.14.0-15-generic" ;;
                "24.10") LATEST_KERNEL="6.11.0-14-generic" ;;
                "24.04") LATEST_KERNEL="6.8.0-52-generic" ;;
                "22.04") LATEST_KERNEL="5.15.0-107-generic" ;;
                *) LATEST_KERNEL="6.8.0-52-generic" ;;
              esac
            fi
            
            KERNELS="[\"${LATEST_KERNEL}\"]"
            echo "Detected kernel version: ${LATEST_KERNEL}"
          fi
          
          echo ""
          echo "========================================"
          echo "  DETECTED BUILD PARAMETERS"
          echo "========================================"
          echo "  NVIDIA Version:  ${NVIDIA_VER}"
          echo "  Ubuntu Version:  ${UBUNTU_VER}"
          echo "  Kernel Version:  ${KERNELS}"
          echo "  Auto-Detected:   ${AUTO_DETECTED}"
          echo "========================================"
          echo ""
          
          echo "nvidia_version=${NVIDIA_VER}" >> $GITHUB_OUTPUT
          echo "ubuntu_version=${UBUNTU_VER}" >> $GITHUB_OUTPUT
          echo "kernel_versions=${KERNELS}" >> $GITHUB_OUTPUT
          echo "auto_detected=${AUTO_DETECTED}" >> $GITHUB_OUTPUT

  build:
    needs: detect-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel_version: ${{ fromJSON(needs.detect-versions.outputs.kernel_versions) }}
    container:
      image: ubuntu:${{ needs.detect-versions.outputs.ubuntu_version }}
    env:
      NVIDIA_VERSION: ${{ needs.detect-versions.outputs.nvidia_version }}
    steps:
      - name: Display build parameters
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "  BUILD PARAMETERS CONFIRMATION"
          echo "========================================"
          echo "  NVIDIA Version:  ${{ needs.detect-versions.outputs.nvidia_version }}"
          echo "  Ubuntu Version:  ${{ needs.detect-versions.outputs.ubuntu_version }}"
          echo "  Kernel Version:  ${{ matrix.kernel_version }}"
          echo "  Auto-Detected:   ${{ needs.detect-versions.outputs.auto_detected }}"
          echo "========================================"
          echo ""

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            kmod \
            libelf-dev \
            cpio \
            file \
            ca-certificates \
            patch \
            jq

      - name: Install kernel headers
        shell: bash
        run: |
          KERNEL_VER="${{ matrix.kernel_version }}"
          echo "Installing kernel headers for ${KERNEL_VER}..."
          
          apt-get install -y linux-headers-${KERNEL_VER} 2>/dev/null || \
          apt-get install -y linux-headers-generic 2>/dev/null || \
          echo "Headers may need manual installation"
          
          ls -la /usr/src/ 2>/dev/null | grep linux-headers || true

      - name: Checkout repository for P2P patch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download NVIDIA driver
        shell: bash
        run: |
          VERSION="${{ env.NVIDIA_VERSION }}"
          echo "Downloading NVIDIA driver version ${VERSION}..."
          
          DRIVER_FILE="NVIDIA-Linux-x86_64-${VERSION}.run"
          
          for url in \
            "https://download.nvidia.com/XFree86/Linux-x86_64/${VERSION}/${DRIVER_FILE}" \
            "https://us.download.nvidia.com/XFree86/Linux-x86_64/${VERSION}/${DRIVER_FILE}" \
            "https://international.download.nvidia.com/XFree86/Linux-x86_64/${VERSION}/${DRIVER_FILE}"; do
            echo "Trying: ${url}"
            if wget -q --show-progress --timeout=60 -O "${DRIVER_FILE}" "${url}"; then
              echo "Download successful"
              break
            fi
          done
          
          if [ ! -f "${DRIVER_FILE}" ]; then
            echo "ERROR: Failed to download NVIDIA driver ${VERSION}"
            exit 1
          fi
          
          chmod +x "${DRIVER_FILE}"
          ls -la "${DRIVER_FILE}"

      - name: Extract driver and kernel sources
        shell: bash
        run: |
          VERSION="${{ env.NVIDIA_VERSION }}"
          DRIVER_FILE="NVIDIA-Linux-x86_64-${VERSION}.run"
          
          echo "Extracting driver..."
          ./${DRIVER_FILE} --extract-only --target nvidia-extracted
          
          echo "Extracted contents:"
          ls -la nvidia-extracted/
          ls -la nvidia-extracted/kernel-open/ 2>/dev/null || true

      - name: Apply P2P patch
        shell: bash
        run: |
          VERSION="${{ env.NVIDIA_VERSION }}"
          cd nvidia-extracted/kernel-open
          
          if [ -f "${GITHUB_WORKSPACE}/p2p.patch" ]; then
            echo "Applying P2P patch from repository..."
            patch -p1 < "${GITHUB_WORKSPACE}/p2p.patch" || echo "Patch may have partial failures, continuing..."
          else
            echo "Creating P2P patch inline..."
            
            if [ -f nvidia/nv-pci.c ]; then
              sed -i 's/if (NVreg_EnableResizableBar == 0)/\/*if (NVreg_EnableResizableBar == 0)*\//' nvidia/nv-pci.c
            fi
            
            if [ -f ../src/nvidia/src/kernel/gpu/bif/kernel_bif.c ]; then
              sed -i 's/pKernelBif->p2pOverride = BIF_P2P_NOT_OVERRIDEN;/pKernelBif->p2pOverride = 0x11;/' ../src/nvidia/src/kernel/gpu/bif/kernel_bif.c
              sed -i 's/pKernelBif->forceP2PType = NV_REG_STR_RM_FORCE_P2P_TYPE_DEFAULT;/pKernelBif->forceP2PType = NV_REG_STR_RM_FORCE_P2P_TYPE_BAR1P2P;/' ../src/nvidia/src/kernel/gpu/bif/kernel_bif.c
            fi
            
            echo "Inline patches applied"
          fi
          
          echo '#define NV_COMPILER "GCC " __VERSION__' > nv_compiler.h

      - name: Prepare binary files
        shell: bash
        run: |
          VERSION="${{ env.NVIDIA_VERSION }}"
          cd nvidia-extracted
          
          mkdir -p src/nvidia/_out/Linux_x86_64
          mkdir -p src/nvidia-modeset/_out/Linux_x86_64
          
          cp kernel-open/nvidia/nv-kernel.o_binary src/nvidia/_out/Linux_x86_64/nv-kernel.o 2>/dev/null || true
          cp kernel-open/nvidia-modeset/nv-modeset-kernel.o_binary src/nvidia-modeset/_out/Linux_x86_64/nv-modeset-kernel.o 2>/dev/null || true
          
          ls -la src/nvidia/_out/Linux_x86_64/ 2>/dev/null || true
          ls -la src/nvidia-modeset/_out/Linux_x86_64/ 2>/dev/null || true

      - name: Build kernel modules
        shell: bash
        run: |
          KERNEL_VER="${{ matrix.kernel_version }}"
          VERSION="${{ env.NVIDIA_VERSION }}"
          cd nvidia-extracted/kernel-open
          
          echo "Building for kernel: ${KERNEL_VER}"
          
          SYSSRC="/usr/src/linux-headers-${KERNEL_VER}"
          if [ ! -d "$SYSSRC" ]; then
            SYSSRC="/lib/modules/${KERNEL_VER}/build"
          fi
          
          if [ -d "$SYSSRC" ]; then
            echo "Using kernel headers from: ${SYSSRC}"
            make -j$(nproc) SYSSRC="${SYSSRC}" 2>&1 | tee build.log
            BUILD_EXIT=${PIPESTATUS[0]}
          else
            echo "ERROR: Kernel headers not found at ${SYSSRC}"
            echo "Available kernel headers:"
            ls -la /usr/src/ | grep linux-headers || true
            ls -la /lib/modules/ || true
            exit 1
          fi
          
          echo ""
          echo "Build exit code: ${BUILD_EXIT}"
          echo ""
          echo "Build artifacts:"
          KO_COUNT=$(find . -name "*.ko" 2>/dev/null | wc -l)
          echo "Found ${KO_COUNT} .ko files"
          
          find . -name "*.ko" -exec ls -la {} \; 2>/dev/null || true
          
          for ko in *.ko; do
            if [ -f "$ko" ]; then
              echo "Module info for ${ko}:"
              modinfo "${ko}" 2>/dev/null | grep -E "vermagic|version" || true
            fi
          done
          
          if [ "$KO_COUNT" -lt 3 ]; then
            echo ""
            echo "ERROR: Build produced only ${KO_COUNT} kernel modules, expected at least 3!"
            echo "Build may have failed. Check build.log for errors."
            echo ""
            echo "Last 50 lines of build log:"
            tail -50 build.log
            exit 1
          fi
          
          echo ""
          echo "Build successful! Produced ${KO_COUNT} kernel modules."

      - name: Package kernel modules
        shell: bash
        run: |
          VERSION="${{ env.NVIDIA_VERSION }}"
          KERNEL_VER="${{ matrix.kernel_version }}"
          UBUNTU_VER="${{ needs.detect-versions.outputs.ubuntu_version }}"
          cd nvidia-extracted
          
          PACKAGE_DIR="nvidia-p2p-modules-${VERSION}-ubuntu${UBUNTU_VER}-kernel-${KERNEL_VER}"
          mkdir -p ${PACKAGE_DIR}/kernel-debs
          
          echo "Copying GPU kernel modules..."
          cp kernel-open/*.ko ${PACKAGE_DIR}/ 2>/dev/null || true
          
          echo "Copying NVIDIA driver..."
          cp NVIDIA-Linux-x86_64-${VERSION}.run ${PACKAGE_DIR}/ 2>/dev/null || true
          
          echo "Downloading Linux kernel packages..."
          UBUNTU_CODENAME=""
          case "${UBUNTU_VER}" in
            "25.10") UBUNTU_CODENAME="questing" ;;
            "25.04") UBUNTU_CODENAME="plucky" ;;
            "24.10") UBUNTU_CODENAME="oracular" ;;
            "24.04") UBUNTU_CODENAME="noble" ;;
            "22.04") UBUNTU_CODENAME="jammy" ;;
          esac
          
          if [ -n "$UBUNTU_CODENAME" ]; then
            KERNEL_MAJOR=$(echo "${KERNEL_VER}" | cut -d'-' -f1)
            
            for pkg in linux-image-${KERNEL_VER} linux-headers-${KERNEL_VER} linux-modules-${KERNEL_VER} linux-modules-extra-${KERNEL_VER}; do
              echo "Downloading ${pkg}..."
              apt-get download ${pkg} 2>/dev/null && \
              mv ${pkg}_*.deb ${PACKAGE_DIR}/kernel-debs/ 2>/dev/null || \
              echo "Package ${pkg} not found in apt, will install from repo"
            done
          fi
          
          echo ""
          echo "Package contents:"
          ls -la ${PACKAGE_DIR}/
          ls -la ${PACKAGE_DIR}/kernel-debs/ 2>/dev/null || true
          
          KO_IN_PACKAGE=$(ls ${PACKAGE_DIR}/*.ko 2>/dev/null | wc -l)
          if [ "$KO_IN_PACKAGE" -lt 3 ]; then
            echo "ERROR: Not enough .ko files in package!"
            exit 1
          fi
          
          INSTALL_SCRIPT_B64=$(cat << 'SCRIPT_END' | base64 -w0
          #!/bin/bash
          set -e
          
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m'
          
          REQUIRED_KERNEL=""
          NVIDIA_VERSION=""
          
          log_info() { echo -e "${GREEN}[INFO]${NC} $1"; }
          log_warn() { echo -e "${YELLOW}[WARN]${NC} $1"; }
          log_error() { echo -e "${RED}[ERROR]${NC} $1"; }
          log_step() { echo -e "${BLUE}[STEP]${NC} $1"; }
          
          check_root() {
              if [ "$EUID" -ne 0 ]; then
                  log_error "Please run as root (sudo ./install.sh)"
                  exit 1
              fi
          }
          
          parse_package_info() {
              local pkg_name=$(basename "${SCRIPT_DIR}")
              NVIDIA_VERSION=$(echo "$pkg_name" | grep -oP 'nvidia-p2p-modules-\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
              REQUIRED_KERNEL=$(echo "$pkg_name" | grep -oP 'kernel-\K[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-generic')
              
              if [ -z "$NVIDIA_VERSION" ]; then
                  for f in "${SCRIPT_DIR}"/NVIDIA-Linux-x86_64-*.run; do
                      [ -f "$f" ] && NVIDIA_VERSION=$(basename "$f" | grep -oP 'NVIDIA-Linux-x86_64-\K[0-9]+\.[0-9]+\.[0-9]+')
                  done
              fi
              
              log_info "Package Info:"
              log_info "  NVIDIA Version: ${NVIDIA_VERSION:-unknown}"
              log_info "  Required Kernel: ${REQUIRED_KERNEL:-unknown}"
              log_info "  Current Kernel:  $(uname -r)"
          }
          
          detect_distro() {
              if [ -f /etc/os-release ]; then
                  . /etc/os-release
                  echo "$ID"
              else
                  log_error "Cannot detect distribution"
                  exit 1
              fi
          }
          
          install_kernel() {
              local current_kernel=$(uname -r)
              
              if [ "$current_kernel" = "$REQUIRED_KERNEL" ]; then
                  log_info "内核 ${REQUIRED_KERNEL} 已在运行"
                  return 0
              fi
            
            log_step "安装内核 ${REQUIRED_KERNEL}..."
            local distro=$(detect_distro)
            
            case $distro in
                ubuntu|debian)
                    if [ -d "${SCRIPT_DIR}/kernel-debs" ]; then
                        log_info "使用本地deb包安装内核..."
                        dp -i "${SCRIPT_DIR}/kernel-debs"/*.deb 2>/dev/null || \
                        dp -i "${SCRIPT_DIR}/kernel-debs"/*.deb || \
                        log_info "从本地deb包安装内核完成"
                        update-grub
                        return
                    fi
                    
                    log_info "从apt仓库安装内核..."
                    apt-get update
                    apt-get install -y linux-image-${REQUIRED_KERNEL} \
                                        linux-headers-${REQUIRED_KERNEL} \
                                        linux-modules-${REQUIRED_KERNEL} \
                                        linux-modules-extra-${REQUIRED_KERNEL} 2>/dev/null || \
                    apt-get install -y linux-image-${REQUIRED_KERNEL} \
                                        linux-headers-${REQUIRED_KERNEL}
                    
                    update-grub
                    ;;
                *)
                    log_error "不支持的发行版: $distro"
                    log_error "请手动安装内核 ${REQUIRED_KERNEL}"
                    exit 1
                    ;;
            esac
            
            log_warn "内核 ${REQUIRED_KERNEL} 已安装，需要重启"
            log_warn "重启后再次运行此脚本继续安装"
            
            echo ""
            echo "========================================"
            echo "  需要重启"
            echo "========================================"
            echo "运行: sudo reboot"
            echo "重启后运行: sudo ./install.sh"
            echo "========================================"
            exit 0
        }
          
          download_driver() {
              if [ -f "${SCRIPT_DIR}/NVIDIA-Linux-x86_64-${NVIDIA_VERSION}.run" ]; then
                  log_info "驱动已存在于包中"
                  return 0
              fi
              
              log_step "下载NVIDIA驱动 ${NVIDIA_VERSION}..."
              
              local driver_file="NVIDIA-Linux-x86_64-${NVIDIA_VERSION}.run"
              local urls=(
                  "https://download.nvidia.com/XFree86/Linux-x86_64/${NVIDIA_VERSION}/${driver_file}"
                  "https://us.download.nvidia.com/XFree86/Linux-x86_64/${NVIDIA_VERSION}/${driver_file}"
                  "https://international.download.nvidia.com/XFree86/Linux-x86_64/${NVIDIA_VERSION}/${driver_file}"
              )
              
              for url in "${urls[@]}"; do
                  log_info "尝试: $url"
                  if wget -q --show-progress -O "${SCRIPT_DIR}/${driver_file}" "$url"; then
                      log_info "下载成功"
                      chmod +x "${SCRIPT_DIR}/${driver_file}"
                      return 0
                  fi
              done
              
              log_error "下载NVIDIA驱动失败"
              exit 1
          }
          
          install_dependencies() {
              local distro=$(detect_distro)
              log_step "安装依赖..."
              
              case $distro in
                  ubuntu|debian)
                      apt-get update
                      apt-get install -y build-essential linux-headers-$(uname -r) wget ca-certificates
                      ;;
                  fedora|rhel|centos)
                      dnf install -y kernel-devel kernel-headers gcc make wget
                      ;;
                  arch)
                      pacman -Sy --noconfirm linux-headers base-devel wget
                      ;;
              esac
          }
          
          disable_nouveau() {
              log_step "禁用nouveau驱动..."
              
              cat > /etc/modprobe.d/blacklist-nouveau.conf << 'EOF'
          blacklist nouveau
          options nouveau modeset=0
          EOF
              
              if command -v update-initramfs &> /dev/null; then
                  update-initramfs -u
              elif command -v dracut &> /dev/null; then
                  dracut --force
              fi
          }
          
          install_nvidia_driver() {
              local driver_file="${SCRIPT_DIR}/NVIDIA-Linux-x86_64-${NVIDIA_VERSION}.run"
              
              if [ ! -f "$driver_file" ]; then
                  log_error "驱动文件未找到: $driver_file"
                  exit 1
              fi
              
              log_step "安装NVIDIA驱动（不含GPU内核模块）..."
              chmod +x "$driver_file"
              "$driver_file" --no-kernel-modules -a -s --no-x-check -z --skip-module-load --silent
          }
          
          install_p2p_modules() {
              log_step "安装P2P内核模块..."
              
              local current_kernel=$(uname -r)
              local modules_dest="/lib/modules/${current_kernel}/kernel/drivers/video/nvidia-p2p"
              
              mkdir -p "${modules_dest}"
              
              local modules=("nvidia.ko" "nvidia-drm.ko" "nvidia-modeset.ko" "nvidia-uvm.ko" "nvidia-peermem.ko")
              local installed=0
              
              for mod in "${modules[@]}"; do
                  if [ -f "${SCRIPT_DIR}/${mod}" ]; then
                      cp "${SCRIPT_DIR}/${mod}" "${modules_dest}/"
                      log_info "已安装: ${mod}"
                      ((installed++))
                  else
                      log_warn "缺失: ${mod}"
                  fi
              done
              
              if [ $installed -lt 3 ]; then
                  log_error "安装的模块不足 ($installed < 3)"
                  exit 1
              fi
              
              depmod -a
              
              if command -v update-initramfs &> /dev/null; then
                  update-initramfs -u
              fi
          }
          
          configure_system() {
              log_step "配置系统..."
              
              cat > /etc/modules-load.d/nvidia.conf << 'EOF'
          nvidia
          nvidia-drm
          nvidia-modeset
          nvidia-uvm
          nvidia-peermem
          EOF
              
              cat > /etc/modprobe.d/nvidia.conf << 'EOF'
          options nvidia NVreg_PreserveVideoMemoryAllocations=1
          options nvidia NVreg_TemporaryFilePath=/var/tmp
          options nvidia-drm modeset=1
          EOF
              
              mkdir -p /var/tmp
          }
          
          configure_iommu() {
              log_step "配置IOMMU以支持P2P..."
              
              if [ -f /etc/default/grub ]; then
                  if ! grep -q "iommu=pt" /etc/default/grub 2>/dev/null; then
                      sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT="/&amd_iommu=on iommu=pt /' /etc/default/grub 2>/dev/null || \
                      sed -i 's/GRUB_CMDLINE_LINUX="/&amd_iommu=on iommu=pt /' /etc/default/grub 2>/dev/null
                      update-grub 2>/dev/null || true
                      log_info "IOMMU配置已添加到GRUB"
                  fi
              fi
          }
          
          print_summary() {
              echo ""
              echo "========================================"
              echo "  NVIDIA P2P 安装完成！"
              echo "========================================"
              echo ""
              echo "  驱动版本: ${NVIDIA_VERSION}"
              echo "  内核版本: $(uname -r)"
              echo ""
              echo "  后续步骤:"
              echo "  1. 重启: sudo reboot"
              echo "  2. 验证: nvidia-smi"
              echo "  3. 检查P2P: nvidia-smi topo -m"
              echo ""
              echo "========================================"
          }
          
          main() {
              echo ""
              echo "========================================"
              echo "  NVIDIA P2P 驱动安装器"
              echo "========================================"
              echo ""
              
              check_root
              parse_package_info
              
              if [ -n "$REQUIRED_KERNEL" ]; then
                  install_kernel
              fi
              
              download_driver
              install_dependencies
              disable_nouveau
              install_nvidia_driver
              install_p2p_modules
              configure_system
              configure_iommu
              print_summary
          }
          
          main "$@"
          SCRIPT_END
          )
          
          echo "${INSTALL_SCRIPT_B64}" | base64 -d > ${PACKAGE_DIR}/install.sh
          chmod +x ${PACKAGE_DIR}/install.sh
          
          cat > ${PACKAGE_DIR}/README.txt << EOF
          ========================================
            NVIDIA P2P 内核模块
            (消费级显卡的甜蜜灵丹妙药)
          ========================================
          
          驱动版本: ${VERSION}
          Ubuntu版本: ${UBUNTU_VER}
          内核版本: ${KERNEL_VER}
          构建日期: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ✨ 功能特点:
          - RTX 4090/5090 消费级显卡的P2P通信支持
          - 基于 NVIDIA/open-gpu-kernel-modules 构建
          - BAR1 P2P 模式已启用
          
          🚀 安装方法:
          1. 解压: tar -xzf ${PACKAGE_DIR}.tar.gz
          2. 安装: cd ${PACKAGE_DIR} && sudo ./install.sh
          3. 重启:  sudo reboot
          4. 验证:  nvidia-smi topo -m
          
          📦 安装脚本功能
          - 自动检测并安装所需内核（优先使用本地deb包）
          - 自动下载NVIDIA驱动（如未包含）
          - 安装不含GPU内核模块的驱动
          - 安装P2P修补过的GPU内核模块
          - 配置IOMMU以支持P2P
          
          ⚠️ 注意事项
          - IOMMU必须启用（脚本会自动配置）
          - 需要root权限（sudo）
          
          🔧 包内容
          - *.ko: P2P修补过的GPU内核模块
          - NVIDIA-Linux-x86_64-*.run: NVIDIA驱动安装包
          - kernel-debs/: Linux内核deb包（可选）
          - install.sh: 一键安装脚本
          
          来源: https://github.com/NVIDIA/open-gpu-kernel-modules
          EOF
          
          tar -czvf ${PACKAGE_DIR}.tar.gz ${PACKAGE_DIR}
          ls -la ${PACKAGE_DIR}.tar.gz
          
          echo ""
          echo "Package size check:"
          du -h ${PACKAGE_DIR}.tar.gz
          if [ $(stat -c%s "${PACKAGE_DIR}.tar.gz") -lt 100000 ]; then
            echo "WARNING: Package seems too small, build may have failed!"
            echo "Checking for .ko files..."
            ls -la ${PACKAGE_DIR}/*.ko 2>/dev/null || echo "No .ko files found!"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-p2p-${{ env.NVIDIA_VERSION }}-ubuntu${{ needs.detect-versions.outputs.ubuntu_version }}-kernel-${{ matrix.kernel_version }}
          path: nvidia-extracted/nvidia-p2p-modules-*.tar.gz
          retention-days: 30

  create-release:
    needs: [detect-versions, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.detect-versions.outputs.nvidia_version }}-auto-${{ github.run_number }}
          name: "💊 亲~密~联欢灵丹妙药 v${{ needs.detect-versions.outputs.nvidia_version }}"
          body: |
